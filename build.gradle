plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom automatically adds the Mojang/Fabric repos needed to fetch Minecraft itself.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Compile-only + runtime-only (not `implementation`): lets us implement ModMenu's
	// config-screen API and test it in the dev client via runClient, without bundling ModMenu
	// into the shipped jar or forcing players who don't have it to need it. The
	// /resourcepackplus command always works regardless of whether ModMenu is present. Fetched
	// via Modrinth's maven, which is far more reliable than smaller independent mod maven hosts.
	compileOnly "${project.modmenu_modrinth_coordinate}"
	runtimeOnly "${project.modmenu_modrinth_coordinate}"

	// No `mappings` block: starting with 26.x, Minecraft ships unobfuscated, so there's no
	// separate Mojang mapping file to fetch — Loom uses the jar's own names directly. Since
	// mods on this version are unobfuscated too, the mod*/plain dependency distinction (which
	// existed to trigger remapping) no longer applies — plain implementation/compileOnly work.

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Release jar naming: "ServerPacks+ v<mod_version> <minecraft_version>.jar" instead of Gradle's
// default "<archivesBaseName>-<version>.jar", so downloaded files are self-explanatory about
// which Minecraft version they target. Matches whichever archive task actually produces the
// final build/libs output, whether or not remapping is involved.
def releaseFileBaseName = "ServerPacks+ v${project.mod_version} ${project.minecraft_version}"
tasks.withType(AbstractArchiveTask).configureEach { task ->
	if (task.name == "jar" || task.name == "remapJar") {
		task.archiveFileName.set("${releaseFileBaseName}.jar")
	} else if (task.name == "sourcesJar" || task.name == "remapSourcesJar") {
		task.archiveFileName.set("${releaseFileBaseName}-sources.jar")
	}
}
