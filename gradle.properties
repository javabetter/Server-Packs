# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache on this Loom version, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft / Fabric — this is the ONLY block you need to touch to port to a newer version.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.2+26.2
# ModMenu, fetched via Modrinth's maven (more reliable CDN than the mod's own host).
# Format is maven.modrinth:<project-id>:<version-id> — these two IDs are specific to
# ModMenu 20.0.1 for Minecraft 26.2.
modmenu_modrinth_coordinate=maven.modrinth:mOgUt4GM:njXb639R

# Mod properties
mod_version=1.0
maven_group=com.rpplus.resourcepackplus
archives_base_name=serverpacksplus
